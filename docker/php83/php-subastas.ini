; Se carga después de php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; UTC es el comportamiento actual (sin date.timezone); cambiarlo altera fechas mostradas y rangos del dashboard.
date.timezone = UTC

memory_limit = 256M
max_execution_time = 60
; NGINX limita el cuerpo completo a 50M (client_max_body_size).
upload_max_filesize = 20M
post_max_size = 48M
max_file_uploads = 20

allow_url_fopen = Off
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 64
