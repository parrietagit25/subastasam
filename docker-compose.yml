services:
  php:
    # Imagen construida fuera del servidor desde docker/php83 (no se construye aquí).
    # Rollback: SUBASTAS_PHP_IMAGE=subastaspcr-php:php8.0.30-rollback-20261022
    image: ${SUBASTAS_PHP_IMAGE:-subastaspcr-php:8.3.36-20261022}
    volumes:
      - ./php20:/var/www/html
    # NGINX usa localhost:8082; no publicar en todas las interfaces.
    ports:
      - 127.0.0.1:8082:80
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      # Volumen NOMBRADO: no se borra con docker compose down (salvo -v).
      - subastas_mysql_data:/var/lib/mysql
      # Solo se ejecuta si el volumen está vacío (primera vez).
      - ./php20/fix_schema.sql:/docker-entrypoint-initdb.d/01_fix_schema.sql
    environment:
      # Las contraseñas solo se aplican al crear el volumen; después se cambian dentro de MySQL.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: subastas
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    # Solo accesible desde el servidor: usar un túnel SSH (ssh -L 8083:127.0.0.1:8083 ...).
    ports:
      - 127.0.0.1:8083:80
    environment:
      PMA_HOST: db

volumes:
  subastas_mysql_data:
