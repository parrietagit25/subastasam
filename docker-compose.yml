services:
  php:
    build: .
    volumes:
      - ./php20:/var/www/html
    ports:
      - 8082:80  
      - 4443:443  
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      # Volumen NOMBRADO: no se borra con docker compose down (salvo -v).
      - subastas_mysql_data:/var/lib/mysql
      # Solo se ejecuta si el volumen está vacío (primera vez).
      - ./php20/fix_schema.sql:/docker-entrypoint-initdb.d/01_fix_schema.sql
    environment:
      # Las contraseñas solo se aplican al crear el volumen; después se cambian dentro de MySQL.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: subastas
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    # Solo accesible desde el servidor: usar un túnel SSH (ssh -L 8083:127.0.0.1:8083 ...).
    ports:
      - 127.0.0.1:8083:80
    environment:
      PMA_HOST: db

volumes:
  subastas_mysql_data:
